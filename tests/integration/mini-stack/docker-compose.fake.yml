# Integration mini-stack (issue #54, tier 3).
#
# Runs the REAL dashboard + the REAL docker-control/-proxy socket proxies against CONTROLLABLE
# fake monerod/Tari, with lightweight p2pool/xmrig-proxy containers the dashboard can actually
# stop/start. This reproduces the runtime control plane end-to-end — sync-hold/release (#35) and
# node-down → reject → readmit (#31) — deterministically, in CI, with no real chain or test box.
#
# Driven by run-mini-stack.sh. The dashboard and the fakes share one image (the dashboard's,
# which already has mining_dashboard + grpc installed, so fake_tari can use the vendored stubs).
name: pithead-itest

x-fake-image: &fake_image pithead-dashboard:itest

networks:
  itestnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  dashboard_data:
  dashboard_stats:

services:
  # The real dashboard, pointed at the fakes and the socket proxies. Fast loop + short debounce
  # so scenarios converge in seconds. Binds 127.0.0.1:8000 inside the container; the runner
  # reads /api/state via `compose exec`, so no published port is needed.
  dashboard:
    build: ../../../dashboard
    image: *fake_image
    container_name: itest-dashboard
    networks: [itestnet]
    # Mirror production's immutable rootfs (#377): the mini-stack e2e then proves the REAL dashboard
    # code runs — writes history, drops markers, serves /api/state — with its rootfs read-only and
    # only /tmp + the volumes writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - dashboard_data:/data
      - dashboard_stats:/app/stats:ro
      # Production control boundary: only requests is writable; results, audit and the host-masked
      # config are read-only. The host runner remains outside this container.
      - ${PITHEAD_ITEST_CONTROL_DIR:?control fixture missing}/requests:/control/requests
      - ${PITHEAD_ITEST_CONTROL_DIR:?control fixture missing}/results:/control/results:ro
      - ${PITHEAD_ITEST_CONTROL_DIR:?control fixture missing}/audit:/control/audit:ro
      - ${PITHEAD_ITEST_CONTROL_DIR:?control fixture missing}/masked:/control/masked:ro
      - ../../../config.reference.json:/host-config/config.reference.json:ro
      - ../../../config.core-keys.json:/host-config/config.core-keys.json:ro
      - type: bind
        source: ${PITHEAD_LOCK_FILE:?PITHEAD_LOCK_FILE is required}
        target: /pithead-lock
        read_only: true
        bind:
          create_host_path: false
    environment:
      HOST_IP: "127.0.0.1"
      TZ: "Etc/UTC"
      MONERO_RPC_URL: "http://172.30.250.11:18081"
      MONERO_NODE_USERNAME: ""
      MONERO_NODE_PASSWORD: ""
      MONERO_NODE_HOST: "172.30.250.11"
      # Override in scenario 11 to exercise the remote RPC path against the same fake.
      LOCAL_MONERO_HOST: "${LOCAL_MONERO_HOST:-172.30.250.11}"
      MONERO_PRUNE: "true"
      TARI_GRPC_ADDRESS: "fake-tari:18142"
      DOCKER_PROXY_URL: "tcp://docker-proxy:2375"
      DOCKER_CONTROL_URL: "tcp://docker-control:2375"
      # Namespaced container names so the mini-stack never collides with — or controls — a real
      # deployment's p2pool/xmrig-proxy on the same host.
      SYNC_GATE_CONTAINERS: "itest-p2pool,itest-xmrig-proxy"
      REJECT_WORKERS_CONTAINER: "itest-xmrig-proxy"
      # Overridable (scenario 11, #562) since it's baked in at container boot — a live toggle
      # isn't possible, so that scenario recreates the stack with TARI_REQUIRED=false.
      TARI_REQUIRED: "${TARI_REQUIRED:-true}"
      XVB_ENABLED: "false"
      XVB_POOL_URL: ""
      XVB_DONOR_ID: ""
      P2POOL_URL: "itest-p2pool:3333"
      MONERO_WALLET_ADDRESS: "49iTestWalletPlaceholderXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      PAYOUT_CONFIRM_ENABLED: "${PAYOUT_CONFIRM_ENABLED:-true}"
      MONERO_WALLET_RPC_URL: "http://172.30.250.12:18082/json_rpc"
      WALLET_RPC_USERNAME: ""
      WALLET_RPC_PASSWORD: ""
      TARI_PAYOUT_CONFIRM_ENABLED: "${TARI_PAYOUT_CONFIRM_ENABLED:-true}"
      TARI_WALLET_ADDRESS: "tari-test-wallet"
      TARI_WALLET_GRPC_ADDRESS: "fake-tari-wallet:18143"
      PROXY_HOST: "172.30.250.14"
      PROXY_API_PORT: "3344"
      PROXY_AUTH_TOKEN: "itest"
      UPDATE_INTERVAL: "2"
      NODE_DOWN_AFTER_SEC: "4"
      TARI_NODE_DOWN_AFTER_SEC: "4"
      NODE_RECOVERY_AFTER_SEC: "3"
      MINING_GUARD_GRACE_SEC: "8"
      HEALTHCHECKS_PING_URL: "http://fake-hc:9000/ph"
      TOR_SOCKS_PROXY: "socks5h://172.30.250.14:1080"
      DASHBOARD_CONTROL_ENABLED: "true"
      TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-true}"
      TELEGRAM_BOT_TOKEN: "itest-token"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-itest-chat}"
      TELEGRAM_API_BASE: "${TELEGRAM_API_BASE:-http://fake-sink:9000}"
      NOTIFY_WEBHOOK_URLS: "${NOTIFY_WEBHOOK_URLS-http://fake-sink:9000/webhook}"
      NTFY_URL: "${NTFY_URL-http://fake-sink:9000/ntfy}"
      NTFY_TOKEN: "itest-token"
      NOTIFY_TOR: "false"
    depends_on: [fake-monerod, fake-tari, fake-wallet-rpc, fake-tari-wallet, docker-control, docker-proxy, p2pool, xmrig-proxy, fake-hc, fake-sink, fake-socks]

  fake-monerod:
    image: *fake_image
    container_name: itest-fake-monerod
    networks:
      itestnet:
        ipv4_address: 172.30.250.11
    entrypoint: []
    # Boot mid-sync so the dashboard holds the miner; the runner flips it to synced/down.
    command: ["python3", "/fakes/fake_monerod.py", "--port", "18081", "--mode", "syncing"]
    ports: ["28081:18081"]   # 28081 on the host (avoids a real monerod's 18081), → 18081 inside
    volumes: ["../fakes:/fakes:ro"]

  # Read by the DASHBOARD's Tari client and nothing else here (TARI_GRPC_ADDRESS above; the runner
  # flips this fake's mode over the control port to drive the sync gate). p2pool's OWN merge-mining
  # gRPC — the leg that makes Tari pay — is NOT exercised in this stack and cannot be: the p2pool
  # below is a busybox stand-in, and the real p2pool builds no merge-mining client until its Monero
  # block-header download completes, so a fake would have to re-implement a synced monerod to be
  # reached at all (#1397, measured at p2pool v4.18's source). That leg lives at tier 4 only —
  # `assert_mergemine_roundtrip` in mergemine-probe.sh, which carries the measurement.
  fake-tari:
    image: *fake_image
    container_name: itest-fake-tari
    networks: [itestnet]
    entrypoint: []
    command: ["python3", "/fakes/fake_tari.py", "--grpc-port", "18142", "--control-port", "18152", "--mode", "syncing"]
    ports: ["28152:18152"]   # HTTP control side-channel on host 28152
    volumes: ["../fakes:/fakes:ro"]

  fake-wallet-rpc:
    image: *fake_image
    container_name: itest-fake-wallet-rpc
    networks:
      itestnet:
        ipv4_address: 172.30.250.12
    entrypoint: []
    command: ["python3", "/fakes/fake_wallet_rpc.py", "--port", "18082"]
    volumes: ["../fakes:/fakes:ro"]

  fake-wallet-down:
    profiles: [wallet-outage]
    image: *fake_image
    container_name: itest-fake-wallet-down
    networks:
      itestnet:
        ipv4_address: 172.30.250.12
    entrypoint: []
    command: ["sleep", "3600"]

  fake-tari-wallet:
    image: *fake_image
    container_name: itest-fake-tari-wallet
    networks: [itestnet]
    entrypoint: []
    command: ["python3", "/fakes/fake_tari_wallet.py", "--grpc-port", "18143", "--control-port", "18153"]
    volumes: ["../fakes:/fakes:ro"]

  # The real image and health script: the wrapper rejects a missing secret, then the harness
  # keeps the container alive long enough for Docker to record the failed gRPC healthcheck.
  tari-wallet-broken:
    profiles: [wallet-health]
    image: ghcr.io/tari-project/minotari_console_wallet:v6.3.0-pre.0-mainnet@sha256:b655139fa60274e3d904e2ea75d7c3e1a4f3b7f4880e161378c1d4f2209cb9de
    container_name: itest-tari-wallet-broken
    networks: [itestnet]
    entrypoint: ["/bin/sh", "-c", "/wallet-config/entrypoint.sh || sleep 60"]
    environment:
      TARI_WALLET_SECRET_FILE_IN: /run/secrets/broken
      WALLET_DIR: /tmp/wallet
      PAYOUT_SCAN_GRACE_SEC: "0"
    volumes: ["../../../build/tari-wallet:/wallet-config:ro"]
    healthcheck:
      test: ["CMD", "/wallet-config/wallet-healthcheck.sh"]
      interval: 1s
      timeout: 5s
      retries: 1

  # Stand-ins for the miner containers: real, named containers the dashboard genuinely
  # stops/starts via docker-control. They just idle.
  p2pool:
    image: busybox:1.38
    container_name: itest-p2pool
    networks: [itestnet]
    command: ["sh", "-c", "while true; do sleep 30; done"]
    volumes:
      - dashboard_stats:/stats

  xmrig-proxy:
    image: busybox:1.38
    container_name: itest-xmrig-proxy
    networks:
      itestnet:
        ipv4_address: 172.30.250.13
    command: ["sh", "-c", "while true; do sleep 30; done"]

  fake-socks:
    image: *fake_image
    container_name: itest-fake-socks
    networks:
      itestnet:
        ipv4_address: 172.30.250.14
    entrypoint: []
    command: ["python3", "/fakes/fake_socks.py", "0.0.0.0", "1080"]
    volumes: ["../fakes:/fakes:ro"]

  # Fake Healthchecks.io ping receiver (#79 e2e): records each ping path to a file the runner greps
  # via `compose exec`. Logs to /tmp (world-writable — the image runs non-root, uid 1000 #255, so a
  # root-owned named volume wouldn't be writable). Shares the dashboard image; stdlib-only, no deps.
  fake-hc:
    image: *fake_image
    container_name: itest-fake-hc
    networks: [itestnet]
    entrypoint: []
    command: ["python3", "/fakes/fake_hc.py", "--port", "9000", "--log", "/tmp/pings.log"]
    volumes:
      - "../fakes:/fakes:ro"

  fake-sink:
    image: *fake_image
    container_name: itest-fake-sink
    networks: [itestnet]
    entrypoint: []
    command: ["python3", "/fakes/fake_sink.py", "--port", "9000"]
    volumes:
      - "../fakes:/fakes:ro"

  # Read-only socket proxy (stats/logs) — mirrors the production docker-proxy.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    container_name: itest-docker-proxy
    command: &socket-proxy-command ["sh", "-c", "sed -i 's/timeout server 0/timeout server 10m/' /tmp/haproxy.cfg; exec haproxy -W -db -f /tmp/haproxy.cfg"]
    networks: [itestnet]
    environment: ["CONTAINERS=1", "LOGS=1"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  # Write proxy scoped to start/stop only — mirrors the production docker-control.
  docker-control:
    image: tecnativa/docker-socket-proxy:3.4
    container_name: itest-docker-control
    command: *socket-proxy-command
    networks: [itestnet]
    environment: ["POST=1", "ALLOW_START=1", "ALLOW_STOP=1"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
