name: N-1 backup fixture

on:
  push:
    paths:
      - tests/os/fixtures/v1.20.0/generate.sh
      - .github/workflows/n1-backup-fixture.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/os/fixtures/v1.20.0/generate.sh fixture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: v1.20.0-backup-fixture
          path: fixture/
          if-no-files-found: error
