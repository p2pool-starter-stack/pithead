name: Browser regressions

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-dialog:
    name: Browser user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install locked browser test dependencies
        run: npm ci --prefix dashboard/tests/browser --ignore-scripts
      - name: Install pinned browsers and system libraries
        run: dashboard/tests/browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser user journeys and HTTPS backup fixtures
        env: {TMPDIR: "${{ runner.temp }}"}
        run: make test-browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            dashboard/tests/browser/test-results/
            dashboard/tests/browser/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain lean UI visual proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sovereign-visual-proof
          path: |
            dashboard/tests/browser/test-results/sovereign-*/shell-*.png
            dashboard/tests/browser/test-results/sovereign-*/drawer-*.png
          retention-days: 7
          if-no-files-found: error
      - name: Install pinned Google Chrome for Testing
        env: {TMPDIR: "${{ runner.temp }}"}
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/chrome-for-testing-public/141.0.7390.37/linux64/chrome-linux64.zip \
            --output "$TMPDIR/pithead-backup-chrome.zip"
          unzip -q "$TMPDIR/pithead-backup-chrome.zip" -d "$TMPDIR/pithead-backup-chrome"
      - name: Assert complete Google Chrome HTTPS backup downloads
        env: {TMPDIR: "${{ runner.temp }}"}
        run: |
          PITHEAD_BACKUP_BROWSER_EXECUTABLE="$TMPDIR/pithead-backup-chrome/chrome-linux64/chrome" \
            node --test dashboard/tests/browser/backup-download.test.mjs
