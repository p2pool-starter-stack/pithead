name: Browser regressions

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-dialog:
    name: Browser native-dialog focus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install locked browser test dependencies
        run: npm ci --prefix dashboard/tests/browser --ignore-scripts
      - name: Install pinned Chromium and system libraries
        run: dashboard/tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Assert native Close, trigger focus and complete HTTPS backup downloads
        run: make test-browser
