name: Upstream pin watch

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the image sweeps
  workflow_dispatch:

# Least privilege (#282): issues.write is the job's one output — it never pushes or publishes.
concurrency:
  group: pin-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pin-watch:
    name: Compare upstream component pins against their latest releases (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          # `ref: ""` is checkout's own default: the ref that triggered the run. On the weekly
          # schedule that is the default branch, which carries every pin the report covers.
          - lane: product
            ref: ""
            title: "Upstream pin currency (weekly report)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Build the currency report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # NOT `set -e`: a non-zero exit here means "one or more lookups could not run", which is
          # a result to publish, not a reason to skip publishing it. The exit code is carried to
          # the last step instead, so a watcher that could not do its job says so in the artefact
          # a human reads AND fails the run.
          bash scripts/watch/pin-watch.sh >report.md
          rc=$?
          # An empty report is itself a failure to report — never publish silence.
          [ -s report.md ] || { echo "The pin watcher produced no report at all — see the run log." >report.md; rc=1; }
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
      - name: Publish it to this lane's tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ matrix.title }}
          RC: ${{ steps.report.outputs.rc }}
        run: |
          set -Eeuo pipefail
          body=$(cat <<'BODY'
          ## What's the problem

          Weekly upstream currency and unchecked dependency pins.

          ## what it impacts

          The product stack and appliance dependencies need tested upgrades when upstream versions advance.

          ## How I found it
          BODY
          cat report.md
          cat <<'BODY'

          ## how important is it

          Version drift alone does not establish a security impact. Stale runtime pins get separate upgrade issues.

          ## acceptance criteria

          All watched pins are checked; upgrade issues carry the required runtime proof.

          ## possible solutions

          Review the component upgrade issues and newer Tari prereleases before changing pins.
          BODY
          )
          # Exact title match over the open list, NOT `--search`: the search index lags behind
          # issue creation by minutes, so a search-based dedup files a second issue on the very
          # next run and then keeps both stale.
          n=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          # A run that could not do its job replaces the report with a failure notice, which would
          # otherwise DELETE the "last fully successful check" date — and that date is the only
          # thing separating "failed once this morning" from "has been dead for six weeks". Carry
          # the previous one forward. A watcher whose own silence is invisible is the exact defect
          # this watcher exists to catch, so it must not have it.
          if [ "$RC" != "0" ] && [ -n "$n" ]; then
            prev=$(gh issue view "$n" --json body --jq .body | grep -a "^_Last fully successful check:" || true)
            # A real `if`, not `[ -n "$prev" ] && body=...`. The && form is safe HERE (set -e is
            # ignored for a non-final command in an AND-OR list, checked rather than assumed), but
            # it evaluates to 1 when $prev is empty — so it only stays safe while something else
            # follows it. That is a reordering hazard for one saved line.
            if [ -n "$prev" ]; then
              body="$body"$'\n\n'"$prev (this run could not complete)"
            fi
          fi
          if [ -n "$n" ]; then
            printf '%s\n' "$body" | gh issue edit "$n" --body-file -
            echo "updated #$n"
          else
            printf '%s\n' "$body" | gh issue create --title "$TITLE" --label infra --label tracker --body-file -
          fi
      - name: Fail the run if any lookup could not be made
        if: steps.report.outputs.rc != '0'
        run: |
          echo "::error::one or more upstream checks or upgrade issue actions failed; see the report and run log"
          exit 1
      # Digest-level check (#1137): does this lane's own docker-compose.yml pins still match what
      # each tag resolves to right now. Separate from the report above on purpose — a version can
      # be current while its digest has drifted, and that half-done-bump case is this step's job,
      # not the report's. A mismatch or failed lookup fails this step, which fails the run.
      - name: Check third-party image pins against their registries
        run: bash scripts/release/resolve-pins.sh
