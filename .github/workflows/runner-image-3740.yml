name: Runner image stack suite (3740 evidence)

on:
  pull_request:
    paths:
      - ".github/workflows/runner-image-3740.yml"

permissions:
  contents: read

jobs:
  stack:
    name: make test-stack in the runner image (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: ae4be28eafaa7ac45eb35149aedc1bdebd24d385
          - label: head
            sha: cb86fe99330676fb43cf5fc56e79addd55e96204
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/docker-registry-mirror
      - name: Rebuild the runner image and run make test-stack
        env:
          OUT: ${{ runner.temp }}/runner-image-${{ matrix.label }}
        run: |
          mkdir -p "$OUT"
          git rev-parse HEAD >"$OUT/sha.txt"
          rc=0
          bash scripts/test-container.sh --build true >"$OUT/build.log" 2>&1 || rc=$?
          echo "$rc" >"$OUT/build-exit.txt"
          rc=0
          bash scripts/test-container.sh make test-stack >"$OUT/stack.log" 2>&1 || rc=$?
          echo "$rc" >"$OUT/stack-exit.txt"
          cat "$OUT/sha.txt" "$OUT/build-exit.txt" "$OUT/stack-exit.txt"
          tail -n 5 "$OUT/stack.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runner-image-stack-${{ matrix.label }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/runner-image-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
