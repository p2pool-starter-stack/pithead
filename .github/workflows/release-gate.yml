name: Release gate (self-hosted, manual dispatch only)

# Tier-4 end-to-end validation against the REAL synced Monero + Tari nodes — the pre-release
# gate (#54). It runs on the dedicated, self-hosted release server (which holds real wallet /
# onion keys), so it MUST only ever run code we trust.
#
# DISPATCH ONLY. This workflow does not gate `main` and does not claim to (#1048). It carried a
# `push: [main]` trigger behind an `if:` that no repo variable ever set, so every merge to main
# recorded a *skipped* run — and a skipped job is green/neutral, so `main` displayed a passing
# release gate that had never once executed. The gating that is real happens elsewhere and is named
# in docs/dev/releasing.md § Which gates are automated: `scripts/release/release.sh` stage 2 runs `make test`
# and the #54 live matrix at cut time and aborts on failure, plus the operator-run bench e2e.
#
# To make this automatic, a self-hosted runner has to exist first: register the release server with
# the `self-hosted, pithead-release` labels (docs/dev/release-server.md), then add back
#   push:
#     branches: [main]
# Do not add the trigger before the runner — a queued job no runner can claim is auto-cancelled
# after 24h and shows as a permanent red ✗ on main.
#
# SECURITY: there is deliberately NO `pull_request` trigger. The protected `release-server`
# environment MUST restrict deployments to the default branch; the branch check inside this file is
# only defense in depth because a selected ref supplies its own workflow. Candidate artifacts are
# staged separately. Never dispatch an unreviewed ref on this persistent key-bearing runner.
on:
  workflow_dispatch:
    inputs:
      stack_dir:
        description: "Path to the deployed Pithead stack on the runner (absolute; default $HOME/code/pithead)"
        required: false
        default: ""
      mode:
        description: "check, matrix, xvb smoke, or combined image-upgrade + matrix + XvB"
        required: false
        default: "check"
        type: choice
        options: [check, matrix, xvb, combined]
      old_sha:
        description: "combined only: exact 40-hex commit of the currently running images"
        required: false
        default: ""
      new_sha:
        description: "combined only: exact 40-hex commit carried by the candidate bundle"
        required: false
        default: ""
      candidate_bundle:
        description: "combined only: absolute path to the private candidate tar.gz"
        required: false
        default: ""
      candidate_signature:
        description: "combined only: absolute path to its detached signature"
        required: false
        default: ""

# Never run two gates against the one shared box at the same time.
concurrency:
  group: release-gate
  cancel-in-progress: false

# Least privilege (#282): this runs on a self-hosted box holding real keys — keep the token read-only.
permissions:
  contents: read

jobs:
  release-gate:
    name: Tier-4 live matrix (real nodes)
    environment: release-server
    # Register the server with these labels: `pithead-release` scopes the gate to the dedicated
    # box; prefer an ephemeral / just-in-time runner in its own runner group.
    runs-on: [self-hosted, pithead-release]
    steps:
      - name: Refuse non-default dispatches (defense in depth)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_GATE_ACTORS: ${{ vars.RELEASE_GATE_ACTORS }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Release gate must be dispatched on refs/heads/$DEFAULT_BRANCH, not $GITHUB_REF." >&2
            exit 1
          fi
          # An unset allowlist makes the subject ",," — which the pattern ",<actor>," matches when
          # the actor is empty. Require both to be non-empty first, so a missing repository variable
          # is a refusal, never a pass.
          if [ -z "${RELEASE_GATE_ACTORS:-}" ]; then
            echo "RELEASE_GATE_ACTORS is not configured; set the repository variable before dispatching." >&2
            exit 1
          fi
          for actor in "$GITHUB_ACTOR" "$TRIGGERING_ACTOR"; do
            if [ -z "$actor" ]; then
              echo "Refusing a dispatch whose actor could not be resolved." >&2
              exit 1
            fi
            case ",$RELEASE_GATE_ACTORS," in
              *,"$actor",*) ;;
              *) echo "Actor $actor is not in the repository-configured RELEASE_GATE_ACTORS allowlist." >&2; exit 1 ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate against the real synced nodes
        # Inputs go through env (not interpolated into the script) to avoid shell injection.
        env:
          STACK_DIR_INPUT: ${{ github.event.inputs.stack_dir }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          OLD_SHA_INPUT: ${{ github.event.inputs.old_sha }}
          NEW_SHA_INPUT: ${{ github.event.inputs.new_sha }}
          CANDIDATE_BUNDLE_INPUT: ${{ github.event.inputs.candidate_bundle }}
          CANDIDATE_SIGNATURE_INPUT: ${{ github.event.inputs.candidate_signature }}
          TRUSTED_COSIGN_PUB_INPUT: /etc/pithead-release/cosign.pub
        run: |
          set -euo pipefail
          DIR="${STACK_DIR_INPUT:-$HOME/code/pithead}"
          MODE="${MODE_INPUT:-check}"
          echo "Release gate: stack dir=$DIR, mode=$MODE"
          test -f "$TRUSTED_COSIGN_PUB_INPUT" && test ! -L "$TRUSTED_COSIGN_PUB_INPUT"
          test "$(stat -c %u "$TRUSTED_COSIGN_PUB_INPUT")" = 0
          mode="$(stat -c %a "$TRUSTED_COSIGN_PUB_INPUT")"
          (( (8#$mode & 022) == 0 ))
          key_dir="$(dirname "$TRUSTED_COSIGN_PUB_INPUT")"
          test "$(stat -c %u "$key_dir")" = 0
          mode="$(stat -c %a "$key_dir")"
          (( (8#$mode & 022) == 0 ))
          cmp -s "$TRUSTED_COSIGN_PUB_INPUT" cosign.pub

          # Always assess fitness + the non-destructive live state first.
          bash tests/integration/run.sh --local --dir "$DIR" --readiness
          bash tests/integration/run.sh --local --dir "$DIR" --check

          # The full destructive config matrix is opt-in; --safety-backup rolls the box back if
          # anything fails, so a red run leaves the server as it found it.
          if [ "$MODE" = "matrix" ]; then
            bash tests/integration/live-supervisor.sh -- bash tests/integration/run.sh --local --dir "$DIR" --workers 2 --safety-backup --lifecycle
          elif [ "$MODE" = "xvb" ]; then
            bash tests/integration/live-supervisor.sh -- bash tests/integration/run.sh --local --dir "$DIR" --workers 2 --safety-backup \
              --scenario local-pruned-main-secure-tari --xvb-routing-smoke
          elif [ "$MODE" = "combined" ]; then
            bash tests/integration/live-supervisor.sh -- bash tests/integration/run.sh --local --dir "$DIR" --workers 2 --safety-backup \
              --image-upgrade "$OLD_SHA_INPUT" "$NEW_SHA_INPUT" \
              --candidate-bundle "$CANDIDATE_BUNDLE_INPUT" "$CANDIDATE_SIGNATURE_INPUT" \
                "$TRUSTED_COSIGN_PUB_INPUT" --lifecycle --xvb-routing-smoke
          elif [ "$MODE" != "check" ]; then
            echo "Unknown release-gate mode: $MODE" >&2
            exit 2
          fi

      - name: Upload artifacts (redacted)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-results
          path: tests/integration/results/
          if-no-files-found: ignore
          retention-days: 14
