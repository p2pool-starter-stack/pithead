name: Go CLI

on:
  push:
    branches: [main, develop, develop-v2.1.0]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: Native CLI and Bash parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the pinned Linux CLI suites
        run: make test-container ARGS="make test-go test-go-parity test-go-shipping"
