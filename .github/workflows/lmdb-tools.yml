name: Monero LMDB tools

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lmdb-tools:
    name: Monero LMDB artifact and consistency proof
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download pinned Monero sources
        run: |
          url=$(python3 -c 'import runpy; print(runpy.run_path("scripts/tools/build-lmdb.py")["SOURCE_URL"])')
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 "$url" -o "$RUNNER_TEMP/monero.tar.gz"
      - name: Build Linux x86_64 utilities
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/tools/build-lmdb.py "$RUNNER_TEMP/monero.tar.gz" "$RUNNER_TEMP/lmdb-tools" "$SOURCE_COMMIT"
      - name: Verify disposable concurrent-writer copies
        run: python3 tests/tools/prove-lmdb.py "$RUNNER_TEMP/monero.tar.gz" "$RUNNER_TEMP/lmdb-tools"
      - name: Package verified tools
        run: |
          cd "$RUNNER_TEMP"
          tar -czf monero-lmdb-linux-x86_64.tar.gz -C lmdb-tools .
          sha256sum monero-lmdb-linux-x86_64.tar.gz > monero-lmdb-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: monero-lmdb-linux-x86_64
          path: |
            ${{ runner.temp }}/monero-lmdb-linux-x86_64.tar.gz
            ${{ runner.temp }}/monero-lmdb-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
