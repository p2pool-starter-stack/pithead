name: Test-harness images

# Build and CVE-scan the images the tier-4 benches run (#2059 follow-up). Separate from ci.yml's
# build-images on purpose, and not only because ci.yml sits at its file-budget ceiling: these are
# a different class of artifact answering a different question. build-images asks "is what we are
# about to SHIP carrying a CVE". This asks "is the harness that validates it carrying one" — a
# bench that handles real keys and real chain data, but whose images reach no user.
#
# Nothing here ships. The release bundle (scripts/release/bundle.sh make_bundle) and the appliance
# image (os/rootfs/Dockerfile) are both strict ALLOWLISTS of named paths, so no tests/ path can
# enter either, and tests/stack/release asserts that rather than trusting it.
#
# Kept deliberately in lockstep with ci.yml's scan step: same pinned action, same engine version,
# same severity and fixability scope. `make lint-trivy-parity` holds all three workflows to one
# TRIVY_VERSION (scripts/watch/trivyignore-watch.sh GATE_WORKFLOWS) — a third copy of this step that
# could drift to a different engine would make trivyignore-watch.sh's verdicts meaningless, which is
# the whole reason that lint exists.

on:
  push:
    branches: [main, develop]
  pull_request:
    # Only when the images or their gate actually change. A scan of bytes that did not move is a
    # run whose green means nothing, and it is the same green either way.
    paths:
      - "tests/netwatch/**"
      - "tests/integration/tor-client/**"
      - "tests/runner/**"
      - ".github/workflows/test-images.yml"
      - ".trivyignore"
  schedule:
    # Weekly, on the same cadence as ci.yml's sweep. A base digest does not change under us, but the
    # CVE database does: an image that scanned clean in March is not clean in September, and nothing
    # else would ever re-ask. Fires from the DEFAULT branch only (`develop`) — see ci.yml's note.
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-images:
    name: Test image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one broken harness image must not hide the other
      matrix:
        include:
          - service: netwatch
            context: tests/netwatch
            build_args: ""
          - service: tor-client
            context: tests/integration/tor-client
            build_args: ""
          # The local test-runner image (#2078). It reaches no user and no bench, but it is where a
          # contributor's verdict comes from, so it rots the same way and gets the same gate.
          # Its two versions come from the Makefile (#1679, #1688) — read, never retyped, exactly
          # as shell.yml installs them.
          - service: test-runner
            context: tests/runner
            build_args: >-
              --build-arg SHELLCHECK_VERSION=$(make -s print-shellcheck-version)
              --build-arg SHFMT_VERSION=$(make -s print-shfmt-version)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build ./${{ matrix.context }}
        run: docker build ${{ matrix.build_args }} -t "pithead-${{ matrix.service }}:ci" "./${{ matrix.context }}"
      # NOT scanned, and the reason is structural rather than convenient. This repo PINS its lint
      # toolchain on purpose — `lint-sh` refuses any shellcheck or shfmt but the one in the
      # Makefile, so a verdict is reproducible — and it pins uv to what ci.yml installs. A
      # CVE-currency gate over an image whose entire job is carrying those pinned versions demands
      # the opposite: shfmt 3.13.1 alone reports 20 HIGH, and clearing them means breaking the pin
      # the lint gate depends on. The two bench images above are a different class: tiny, and they
      # run where real keys and chain data live. This one ships to no user and no bench.
      # It is still BUILT here, so a broken Dockerfile still reds, and Dependabot still bumps its
      # base digest.
      #
      # The scope was checked rather than assumed, because #2084 was filed believing this skipped
      # only `usr/local/bin/uv` and `usr/local/bin/uvx` and scanned the rest. It does not — the `if`
      # below skips the whole image — and the difference matters, because "remove the skip and the
      # image scans clean" is not reachable. Measured on the built image, fixable HIGH/CRITICAL only
      # (the gate's own scope), 2026-09-11:
      #
      #   debian 12.13 (os-pkgs)   6      usr/bin/gh                   2
      #   Node.js (base image)    20      docker-buildx                1
      #   usr/local/bin/shfmt     20      usr/local/bin/uv + uvx       4
      #
      # 53 across seven targets, and clearing shfmt's 20 means breaking the version `lint-sh`
      # refuses to run without. A narrow skip would have to name every one of those targets, which
      # is this `if` with more lines. uv's own pair went 4 -> 0 in #2084, measured on the digests
      # directly, since this gate would not have reported it either way.
      - name: Scan image for CVEs (Trivy)
        if: matrix.service != 'test-runner'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Explicit, and held equal to ci.yml's by `make lint-trivy-parity` (#1290).
          version: v0.74.0
          image-ref: pithead-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          # cache: false for the same reason as ci.yml (#1159): the action's DB cache is per-ref and
          # day-granular, so a branch's first run of the day freezes its database until midnight and
          # the gate's answer starts depending on when the branch last ran.
          cache: "false"
