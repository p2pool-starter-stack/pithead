name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Two Monday sweeps hang off this schedule (every other job gates itself off the event, so only
  # these two run): build-images (#833) rebuilds this branch and scans the rebuild — the only
  # sweep that can go red before a release. sweep-shipped (#1313) scans the published ghcr images
  # by resolved digest — a rebuild resolves apt at scan time and would hide archive fixes the
  # shipped bytes never got — and reports into a tracking issue rather than reddening, since a
  # fixable CVE in a shipped image asks for a patch release, a person's decision.
  # THIS cron block is the one that fires: `schedule:` reads from the DEFAULT branch only, and
  # `develop` is it. Change the cadence here, and prove it fired with `gh run list --json event` —
  # a schedule that never runs looks exactly like one that ran and found nothing (#1162).
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

# Least privilege (#282): every job here only reads the repo — none push commits, comment, or
# publish packages. Narrowing the default GITHUB_TOKEN limits the blast radius of a compromised step.
permissions:
  contents: read

# Cancel superseded runs of the same PR; never cancel push runs on main/develop (they set the
# diff-cover baseline and are required checks on the protected branch). #415.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    name: Dashboard tests (pytest + coverage)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never  # use the setup-python 3.11; don't fetch another interpreter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so diff-cover can diff the PR against origin/develop (#286)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Install uv (pinned — reproducible, hash-locked installs, #283)"
        # Curl the pinned installer (same posture as hadolint below); avoids a mutable-tag action.
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"   # deterministic install dir (runners may set CARGO_HOME)
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # download then run, never a pipe: the pipeline's status is sh's, which is 0 on empty input, so a failed download passed this step (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Dashboard tests + coverage gate (emits coverage.xml)
        run: make test-dashboard
      - name: "Patch-coverage gate — changed lines >=90% (diff-cover vs the PR's own base, #286)"
        # GITHUB_BASE_REF is set on pull_request runs; push runs fall back to develop. Grading a PR
        # against develop instead of its base branch charges it the base branch's whole coverage
        # debt (a bash-only appliance PR once failed on wizard.py lines it never touched).
        run: |
          git fetch --no-tags origin develop "${GITHUB_BASE_REF:-develop}"
          make test-patch-coverage
      - name: Fake-daemon contract test (real clients vs controllable fakes)
        # Points the real Monero/Tari clients at the integration fakes and asserts they parse
        # every state (synced/syncing/down). Docker-free, so it runs on every PR (issue #54).
        run: make test-fakes

  frontend:
    name: Frontend logic tests (node --test)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Pure client logic uses Node's built-in runner; the Make target first builds the generated
      # CLI read by cross-surface drift tests. There is no package.json/node_modules build step.
      # Component rendering is covered by a manual browser smoke test, not here.
      - name: Run frontend logic tests
        run: make test-frontend

  dashboard-image:
    name: Dashboard image (Docker test stage)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the dashboard test stage (installs package + runs the suite in-container)
        run: docker build --target test ./dashboard

  build-images:
    # Build every build/* image, plus dashboard/ (moved out of build/, #1106), so a broken
    # Dockerfile / COPY path / entrypoint / pinned-digest is caught in CI instead of at deploy
    # time (#124). Previously only the dashboard test stage was built, so e.g. the Tor image's
    # entrypoint restructure (#180) shipped with no CI safety net. Tari is an upstream image (no
    # Dockerfile here), so it's excluded. fail-fast: false so one broken image doesn't hide the
    # others; empty build-args keep the dashboard build working bare.
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monero
            context: build/monero
          - service: p2pool
            context: build/p2pool
          - service: tor
            context: build/tor
          - service: xmrig-proxy
            context: build/xmrig-proxy
          - service: dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build ./${{ matrix.context }}
        run: docker build -t "pithead-${{ matrix.service }}:ci" "./${{ matrix.context }}"
      - uses: ./.github/actions/install-trivy # the only step that installs trivy here (#2214)
        with:
          # THE live pin, and the only one: this literal is what gets installed, and it is the
          # line `make lint-trivy-parity` reads (#1290). trivy-action below declares no version:
          # at all — with skip-setup-trivy it never installs, so a version: there would be inert.
          version: v0.73.0
      - name: Scan image for CVEs (Trivy)
        # Gate on actionable (fixable) HIGH/CRITICAL only; accepted findings live in .config/trivyignore.
        # Must stay green before v1.1 images publish (#282).
        # cache: false is load-bearing (#1159): the DB cache is per-ref and day-scoped, so a
        # branch's first run of the day freezes its DB until midnight — a gate whose answer
        # depends on when it last ran is not a gate (on 2026-08-20 the identical dashboard image
        # passed on one branch and failed on another 40s apart for that reason). Fresh-download
        # cost: 108.49 MiB/3.3s vs a ~997 MB/13.9s cache restore, 7.5 GB of cache budget freed.
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true # scans with the binary the step above installed (#1290, #2214)
          image-ref: pithead-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .config/trivyignore
          cache: "false"
      - name: Retry Scan image for CVEs (Trivy)
        if: steps.trivy-scan.outcome == 'failure'
        uses: ./.github/actions/retry-trivy-scan
        with:
          image-ref: pithead-${{ matrix.service }}:ci
          trivyignores: .config/trivyignore

  sweep-shipped:
    # The half of the Monday sweep that reports on what users are running (#1313). `build-images`
    # above scans a rebuild of this branch; this scans the bytes on the registry.
    #
    # Every leg resolves the published TAG to a DIGEST and scans the digest. That is not
    # ceremony: a tag is a moving pointer, so "we scanned :v1.20.0" stops being a statement about
    # any particular image the moment it moves, and the digest is the only reference that names
    # the bytes a user pulled. The digest scanned is printed in the report.
    #
    # fail-fast: false so one unreachable image does not hide the other four — and a leg that
    # fails still shows up, because the report job runs on `always()` and names any image it
    # received no scan for as UNCHECKED rather than counting it as clean.
    name: Shipped-image CVE sweep (${{ matrix.service }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [monero, p2pool, tor, xmrig-proxy, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the shipped tag to a digest, and take main's own Trivy ignore file
        id: shipped
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -Eeuo pipefail
          # The scheduled run checks out develop. `main` is a different ref and a shallow clone
          # does not carry it, so fetch it rather than assume it is here — since #1076 `main` is a
          # fast-forward pointer to the released tag, and it is the only ref that knows what
          # shipped.
          git fetch --no-tags --depth=1 origin main
          ver="$(git show origin/main:VERSION)"
          [ -n "$ver" ] || { echo "::error::main carries no VERSION — cannot tell what shipped"; exit 1; }
          tag="v$ver"
          # main's OWN .trivyignore, never develop's; tries the moved path, falls back to the
          # pre-move root path until main carries #1901's move (PR #2201), then drop the fallback.
          git show origin/main:.config/trivyignore >main.trivyignore 2>/dev/null || git show origin/main:.trivyignore >main.trivyignore
          repo="p2pool-starter-stack/pithead-$SERVICE"
          # The packages are public, so an anonymous pull token is enough — no registry secret
          # enters this workflow.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -er .token)"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag" |
            tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')"
          # An unresolved digest must never fall through to a tag scan: the report would then say
          # "shipped image" about bytes nobody can identify. Fail the leg instead and let it read
          # UNCHECKED.
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' ||
            { echo "::error::could not resolve ghcr.io/$repo:$tag to a digest — got [$digest]"; exit 1; }
          echo "ref=ghcr.io/$repo@$digest" >>"$GITHUB_OUTPUT"
          # The tag every leg swept, so the report can refuse to mix two releases if a cut lands
          # mid-run.
          printf '%s\n' "$tag" >"sweep-$SERVICE.tag"
      - uses: ./.github/actions/install-trivy # the only step that installs trivy here (#2214)
        with:
          version: v0.73.0 # THE live pin, read by `make lint-trivy-parity` — see build-images (#1290)
      - name: Scan the published image by digest (Trivy)
        # Same scope as the gate above, and the same engine — but only because #1290's pin is on
        # both jobs' install-trivy steps, each read by `make lint-trivy-parity`. Comparing this
        # sweep's verdict against the rebuild's is the whole reason both exist, and those two
        # literals are what decide which engine each job installs and therefore scans with.
        #
        # trivy pulls the digest from the registry itself — nothing is built here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true # scans with the binary the step above installed (#1290, #2214)
          image-ref: ${{ steps.shipped.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only, deliberately. A fixable CVE in an image that is already published cannot
          # be fixed by failing this run; it asks for a patch release. The run goes red only when
          # the sweep itself could not do its job, which the report job decides.
          exit-code: "0"
          trivyignores: main.trivyignore
          cache: "false"
          format: json
          output: sweep-${{ matrix.service }}.json
      - name: Upload this image's scan output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-sweep-${{ matrix.service }}
          path: |
            sweep-${{ matrix.service }}.json
            sweep-${{ matrix.service }}.tag
          # An empty upload would reach the report job as a scan that found nothing, which is the
          # one thing this must never say off a leg that did not scan.
          if-no-files-found: error

  sweep-shipped-report:
    # One tracking issue, edited in place — the pin-watch.yml / trivyignore-watch.yml posture. An
    # issue persists, is assignable, and lets a person write "held until the next cut, here's why"
    # in a comment. A red square in the Actions tab cannot hold that, and this finding's whole
    # value is the conversation about whether to cut a patch release.
    name: Shipped-image CVE sweep — tracking issue
    # always() so a failed scan leg still reports: an image with no scan output is UNCHECKED, and
    # saying so is the entire point. Skipping the report on a partial sweep would leave the last
    # good report standing as if it were current.
    if: always() && github.event_name == 'schedule'
    needs: sweep-shipped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege (#282): issues.write is this job's one output — it never pushes or publishes.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect every leg's scan output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shipped-sweep-*
          merge-multiple: true
          path: shipped-sweep
      - name: Render the report
        id: report
        run: |
          set -uo pipefail
          # NOT `set -e`: an incomplete sweep is a result to publish, not a reason to publish
          # nothing. The script names the images it could not check and exits 1; the rc is
          # carried to the last step so the run still fails loudly.
          bash scripts/watch/shipped-image-sweep-report.sh shipped-sweep >report.md
          rc=$?
          # An empty report is itself a failure to report — never publish silence.
          [ -s report.md ] || { echo "The shipped-image sweep produced no report at all — see the run log." >report.md; rc=1; }
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
      - name: Publish it to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.report.outputs.rc }}
        run: |
          set -Eeuo pipefail
          # The title is the upsert key and it lives in the script, so there is exactly one
          # spelling of it anywhere. A second spelling here would file a second issue on the very
          # next run and then keep both stale.
          TITLE="$(bash scripts/watch/shipped-image-sweep-report.sh --title)"
          body=$(cat report.md)
          # Exact title match over the open list, NOT `--search`: the search index lags issue
          # creation by minutes, so a search-based dedup files a second issue on the next run.
          n=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          # A run that could not do its job must not DELETE the "last fully successful" date —
          # that date is the only thing separating "failed once this morning" from "has been dead
          # for six weeks". Stamp it on success, carry it forward on failure (pin-watch pattern).
          if [ "$RC" = "0" ]; then
            body="$body"$'\n\n'"_Last fully successful sweep: $(date -u +%F)_"
          elif [ -n "$n" ]; then
            prev=$(gh issue view "$n" --json body --jq .body | grep -a "^_Last fully successful sweep:" || true)
            if [ -n "$prev" ]; then
              body="$body"$'\n\n'"$prev (this run could not complete)"
            fi
          fi
          if [ -n "$n" ]; then
            gh issue edit "$n" --body "$body"
            echo "updated #$n"
          else
            gh issue create --title "$TITLE" --label infra --body "$body"
          fi
      - name: Fail the run if the sweep could not cover every shipped image
        if: steps.report.outputs.rc != '0'
        run: |
          echo "::error::the shipped-image sweep did not cover every published image — those images are UNCHECKED, not clean"
          exit 1

  hadolint:
    name: Dockerfile lint (hadolint)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install hadolint (pinned + sha256-verified, #286)"
        run: |
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
      - name: Lint all build/* and dashboard/ Dockerfiles (config in .config/hadolint.yaml)
        run: hadolint --config .config/hadolint.yaml build/*/Dockerfile dashboard/Dockerfile

  python-lint:
    name: Python lint + format (ruff)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"   # deterministic install dir (runners may set CARGO_HOME)
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: ruff check + format --check (config in dashboard/pyproject.toml + root ruff.toml)
        # Single source of truth: the Makefile `lint-py` target, which runs ruff via uv from the
        # locked `dev` extra — one pinned ruff for CI, pre-commit, and local devs.
        run: make lint-py

  gitleaks:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the scan covers every commit, not just the tip
      - name: Scan git history for secrets (gitleaks, pinned by digest)
        # Run via the pinned image (gitleaks-action needs a license for org repos); accepted false
        # positives live in .config/gitleaks.toml. --log-opts=HEAD scopes the scan to this ref's commits (#2203).
        run: |
          docker run --rm -v "$PWD":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --config /repo/.config/gitleaks.toml --gitleaks-ignore-path /repo/.config/gitleaksignore --log-opts=HEAD

  zizmor:
    name: Workflow audit (zizmor)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit workflows (injection, token scope, self-hosted-runner risks)
        run: uvx zizmor@1.25.2 --offline .github/workflows/

  compose:
    name: Compose config + security hardening
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml interpolation + hardening invariants (#90)
        run: make test-compose

  lint-surfaces:
    name: Lint per-surface (biome, yaml, markdown, proto, toml)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # lint-file-budget's ratchet needs origin/develop to exist, or it skips (#1452, #1608)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Lint docs voice, operator strings, topology classes, file budget, pithead build/trivy parity, then JS/CSS (Biome), YAML, Markdown, proto (buf), TOML (taplo)
        # Single source of truth: the Makefile targets. REPO-LOCAL GATES FIRST (#1746): local checks run before network-backed surface linters.
        run: make lint-docs-voice lint-path-references lint-operator-strings lint-topology lint-file-budget lint-pithead-build lint-trivy-parity lint-js lint-yaml lint-md lint-proto lint-toml
