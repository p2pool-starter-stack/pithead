name: Security sweep

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sweep
  cancel-in-progress: false

jobs:
  refs:
    name: List the refs to sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - name: List develop, main and every develop-v* branch
        id: list
        run: |
          set -Eeuo pipefail
          extra="$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" 'develop-v*' | sed 's|.*refs/heads/||' | grep -E '^develop-v[0-9A-Za-z._-]+$' | sort || true)"
          refs="$(printf 'develop\nmain\n%s\n' "$extra" | grep -v '^$' | jq -R . | jq -sc .)"
          echo "refs=$refs" >>"$GITHUB_OUTPUT"
          echo "$refs"

  scan-ref:
    name: Scan ${{ matrix.ref }}
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    env:
      OSV_SCANNER_VERSION: v2.7.1
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.13"
          checksum: 745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd
          enable-cache: false
      - name: Install osv-scanner (sha256-verified release binary)
        run: |
          set -Eeuo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfiles at this ref (osv-scanner)
        env:
          REF: ${{ matrix.ref }}
        run: |
          set -Eeuo pipefail
          mkdir -p out
          printf '%s\n' "$REF" >out/ref.txt
          cd src
          args=()
          while IFS= read -r f; do args+=(-L "$f"); done < <(git ls-files 'uv.lock' '*/uv.lock' 'package-lock.json' '*/package-lock.json' 'Cargo.lock' '*/Cargo.lock')
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no lockfile found at $REF — nothing was scanned"; exit 1; }
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" --format json --output-file ../out/osv.json || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 1 ] || { echo "::error::osv-scanner failed with exit code $rc"; exit 1; }
          [ -s ../out/osv.json ] || { echo "::error::osv-scanner wrote no report"; exit 1; }
      - name: Audit the workflows at this ref (zizmor, online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd src
          uvx zizmor@1.25.2 --format json --no-exit-codes .github/workflows/ >../out/zizmor.json
          jq -e 'type == "array"' ../out/zizmor.json >/dev/null
      - name: Upload this ref's scan output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-ref-${{ strategy.job-index }}
          path: out/
          if-no-files-found: error

  report-ref:
    name: Update the per-ref security issues
    needs: [refs, scan-ref]
    if: always() && needs.refs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-ref-*
          path: sweep
      - name: Upsert one issue per swept ref
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          for d in sweep/sweep-ref-*; do
            [ -d "$d" ] || continue
            ref="$(cat "$d/ref.txt")"
            bash scripts/watch/security-issue.sh render-ref "$d" >"$d/body.md"
            bash scripts/watch/security-issue.sh upsert "$(bash scripts/watch/security-issue.sh title-ref "$ref")" "$d/body.md"
          done

  sweep-shipped:
    name: Shipped-image CVE sweep (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [monero, p2pool, tor, xmrig-proxy, dashboard, os-rootfs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the shipped tag to a digest, and take main's own Trivy ignore file
        id: shipped
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin main
          ver="$(git show origin/main:VERSION)"
          [ -n "$ver" ] || { echo "::error::main carries no VERSION — cannot tell what shipped"; exit 1; }
          tag="v$ver"
          git show origin/main:.config/trivyignore >main.trivyignore 2>/dev/null || git show origin/main:.trivyignore >main.trivyignore
          repo="p2pool-starter-stack/pithead-$SERVICE"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -er .token)"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag" |
            tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' ||
            { echo "::error::could not resolve ghcr.io/$repo:$tag to a digest — got [$digest]"; exit 1; }
          echo "ref=ghcr.io/$repo@$digest" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$tag" >"sweep-$SERVICE.tag"
      - uses: ./.github/actions/install-trivy
        with:
          version: v0.73.0
      - name: Scan the published image by digest (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.shipped.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: main.trivyignore
          cache: "false"
          format: json
          output: sweep-${{ matrix.service }}.json
      - name: Upload this image's scan output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipped-sweep-${{ matrix.service }}
          path: |
            sweep-${{ matrix.service }}.json
            sweep-${{ matrix.service }}.tag
          if-no-files-found: error

  sweep-shipped-report:
    name: Shipped-image CVE sweep — tracking issue
    if: always()
    needs: sweep-shipped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect every leg's scan output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shipped-sweep-*
          merge-multiple: true
          path: shipped-sweep
      - name: Render the report
        id: report
        run: |
          set -uo pipefail
          bash scripts/watch/shipped-image-sweep-report.sh shipped-sweep >report.md
          rc=$?
          [ -s report.md ] || { echo "The shipped-image sweep produced no report at all — see the run log." >report.md; rc=1; }
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
      - name: Publish it to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.report.outputs.rc }}
        run: |
          set -Eeuo pipefail
          TITLE="$(bash scripts/watch/shipped-image-sweep-report.sh --title)"
          body=$(cat report.md)
          for t in "$TITLE" "Shipped-image CVE sweep (weekly report)"; do n=$(bash scripts/watch/find-open-issue.sh "$t"); [ -z "$n" ] || break; done
          if [ "$RC" = "0" ]; then
            body="$body"$'\n\n'"_Last fully successful sweep: $(date -u +%F)_"
          elif [ -n "$n" ]; then
            prev=$(gh issue view "$n" --json body --jq .body | grep -a "^_Last fully successful sweep:" || true)
            if [ -n "$prev" ]; then
              body="$body"$'\n\n'"$prev (this run could not complete)"
            fi
          fi
          if [ -n "$n" ]; then
            gh issue edit "$n" --title "$TITLE" --add-label security --body "$body"
            echo "updated #$n"
          else
            gh issue create --title "$TITLE" --label security --body "$body"
          fi
      - name: Fail the run if the sweep could not cover every shipped image
        if: steps.report.outputs.rc != '0'
        run: |
          echo "::error::the shipped-image sweep did not cover every published image — those images are UNCHECKED, not clean"
          exit 1
