name: Link check (lychee)

# Scheduled (not per-PR) so flaky external links never redden a PR (#281). The run goes red in the
# Actions tab if a link breaks; trigger on demand with workflow_dispatch. Ignored URLs: .config/lycheeignore.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --exclude-file is deprecated upstream (lychee TODO: removed at 1.0), but --exclude-path is
          # NOT a substitute for it: --exclude-path excludes filesystem paths from the crawl, while
          # --exclude-file supplies URL patterns to ignore. Both appear below doing those two
          # different jobs. When the flag finally goes, the replacement is a `.lycheeignore`
          # auto-discovered in the working directory — which is the root file #1901 moved to
          # .config/ — so that migration has to move it back or run lychee from .config/.
          args: "--no-progress --exclude-file .config/lycheeignore --exclude-path docs/research/xvb-delivery-study/data/sources './**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher github.com rate limit for repo links
