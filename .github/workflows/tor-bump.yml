name: Tor pin bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Open a PR when Alpine carries a newer tor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Detect a newer tor in the Alpine repository
        id: detect
        run: bash scripts/watch/tor-bump.sh detect >>"$GITHUB_OUTPUT"
      - name: Open the bump PR
        if: steps.detect.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOR_BUMP_TOKEN || github.token }}
          CURRENT: ${{ steps.detect.outputs.current }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -Eeuo pipefail
          branch="bot/tor-${LATEST}"
          if [ "$(gh pr list --state open --head "$branch" --json number --jq length)" != 0 ]; then
            echo "PR for ${LATEST} already open"
            exit 0
          fi
          if [ -z "$(git ls-remote --heads origin "$branch")" ]; then
            bash scripts/watch/tor-bump.sh apply "$LATEST"
            git checkout -b "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "build/tor: bump the Tor pin to ${LATEST}"
            gh auth setup-git
            git push origin "$branch"
          fi
          cat >pr-body.md <<EOF
          ## What's the problem
          Alpine now carries tor ${LATEST}; \`build/tor/Dockerfile\` pins ${CURRENT}, so the image build fails once the repository drops the old package (#4125).

          ## How I fixed it
          Automated bump of \`ARG TOR_VERSION\` only (\`scripts/watch/tor-bump.sh\`).

          ## Here is the proof
          Pending: the \`tier4-kvm\` \`tor-heal\` phase must be green at this head before merge; it is the live proof of Tor state-file behaviour.
          EOF
          gh pr create --base develop --head "$branch" --label dependencies \
            --title "build/tor: bump the Tor pin to ${LATEST}" --body-file pr-body.md
