name: Install Trivy (cached binary)
description: >
  The ONLY thing that installs trivy in the gate workflows, and the only place the engine version
  is decided. Calls aquasecurity/setup-trivy with its own version/os/arch-keyed binary cache
  (#2214) — a different cache from trivy-action's DB cache, which the call sites deliberately keep
  off (#1159) and which trivy-action's single `cache:` input cannot separate from this one. Once
  that cache has a hit for a version, the GitHub-Releases fetch that #2214 was filed for is not
  made again for it. Callers then pass `skip-setup-trivy: true` to trivy-action (and to
  ./.github/actions/retry-trivy-scan), so nothing else installs and nothing else declares a
  version: this action holds NO pin of its own — `version` is a required input, and the caller's
  literal is the one line `make lint-trivy-parity` reads (#1290). Bump that line and the engine
  that actually runs moves with it; scripts/lint/lint-trivy-installer-cache.sh tests exactly that.
  A cold cache still calls the same installer, so three attempts with a short backoff rather than
  one — #2214's outage window was minutes long. Those three attempts are the install-side
  backstop and the whole of it: if all three fail, this step fails and the job stops, which is the
  correct answer for a required CVE gate. The caller's retry-trivy-scan step backstops a failed
  SCAN, not a failed install — it never runs if this step fails.
inputs:
  version:
    description: "Trivy engine to install, e.g. v0.73.0 — THE pin: `make lint-trivy-parity` reads the caller's literal (#1290, #2214)"
    required: true
runs:
  using: composite
  steps:
    - id: attempt1
      continue-on-error: true
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
    - if: steps.attempt1.outcome == 'failure'
      run: sleep 15
      shell: bash
    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      run: sleep 30
      shell: bash
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
