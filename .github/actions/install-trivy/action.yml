name: Install Trivy (cached binary)
description: >
  Installs the Trivy binary via aquasecurity/setup-trivy with its own
  version/os/arch-keyed cache (#2214) — a different cache from trivy-action's
  DB cache, which the three trivy-action call sites (ci.yml, os-rootfs.yml,
  test-images.yml) deliberately keep off (#1159). Once this cache is
  populated for a version, a GitHub Releases hiccup in the installer no
  longer fails every scan that version runs; call this step first, then pass
  `skip-setup-trivy: true` to trivy-action so it reuses this binary instead
  of re-running its own copy of the same installer. This action holds NO
  pin of its own: `version` is a required input, and every call site passes
  it the exact literal it also gives trivy-action's own `version:`, the one
  `make lint-trivy-parity` (#1290) reads — so that literal stays the single
  live source, and this action can never drift from it into an unvalidated
  second pin. Until the cache has a hit, this still calls the same
  GitHub-Releases installer the cache exists to avoid — so three attempts
  with a short backoff, not one, because #2214's own outage window was
  itself minutes long (rotated between an unrelated build 20 minutes apart)
  and a single retry lands inside it as often as not.
inputs:
  version:
    description: "Trivy version to install, e.g. v0.74.0 — must match the caller's own trivy-action version: (#1290, #2214)"
    required: true
runs:
  using: composite
  steps:
    - id: attempt1
      continue-on-error: true
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
    - if: steps.attempt1.outcome == 'failure'
      run: sleep 15
      shell: bash
    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      run: sleep 30
      shell: bash
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: ${{ inputs.version }}
        cache: true
