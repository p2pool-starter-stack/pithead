name: Retry a failed Trivy scan
description: >
  Re-runs the same pinned trivy-action invocation once. setup-trivy's install.sh resolves the
  pinned tag through an undocumented, unauthenticated `github.com/.../releases/<tag>` JSON
  endpoint (not the GitHub API), which intermittently 404s on a tag that exists (#2215) —
  confirmed transient, not a withdrawn release: the same pin passes on a bare rerun with no code
  change. This declares NO `version:` of its own and sets `skip-setup-trivy: true`: the caller
  installs the engine once, up front, via ./.github/actions/install-trivy, whose `version:` is the
  single pin `make lint-trivy-parity` reads (#1290, #2214). A second pin here would decide which
  engine the retry path runs while sitting outside that gate — so there isn't one, and this step
  re-scans with the binary already on $GITHUB_PATH rather than installing a second time.
inputs:
  image-ref:
    required: true
  trivyignores:
    required: true
runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        skip-setup-trivy: true
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        trivyignores: ${{ inputs.trivyignores }}
        cache: "false"
