# gitleaks secret-scan config (Wave 7 tooling, #282). Extends the upstream default ruleset.
[extend]
useDefault = true

[[allowlists]]
description = "Accepted false positives"
regexTarget = "line"
# Archived third-party source pages in the research record (checksummed, reviewed on archive):
# hex example IDs in the p2pool.observer API docs and page-chrome tokens in saved GitHub HTML
# pattern-match crypto-token rules. The archives must stay byte-identical to their recorded
# checksums, so the redaction that would normally fix a finding is impossible by design.
paths = [
  # both path forms exist in history: pre-move (research/...) and current (docs/research/...)
  '''(docs/)?research/xvb-delivery-study/data/sources/.*''',
]
# curl auth assembled from shell ENV VARS (e.g. `-u "${USER:-}:${PASS:-wallet}"`) is not a hardcoded
# secret — the upstream `curl-auth-user` rule can't distinguish `${VAR}` from a literal credential.
# Both sides must be `${VAR:-default}` expansions (default optional), so a real `-u "admin:hunter2"`
# is still caught.
regexes = [
  '''-u "\$\{[A-Z_]+:-[^}]*\}:\$\{[A-Z_]+:-[^}]*\}"''',
  # Fixture password in the wizard handoff-card frontend test — a made-up literal the test
  # asserts is RENDERED, so it can't be replaced with an env var. CI scans every pushed ref,
  # so this must be allowlisted even while the branch that carries it is still in flight.
  '''rX6d2A4sGBHFEcQT4TVQQJRQg7xtbDMg''',
  # Fixed all-digit control-token fixture used by the worker adoption and derived-read tests.
  '''0123456789abcdef0123456789abcdef''',
]

# Restore tests need generated-shape values so the allowlist validator exercises its real branches.
# Exempt only these complete fixture lines in the exact test files that construct those archives.
[[allowlists]]
description = "Synthetic generated proxy-token restore fixtures"
condition = "AND"
regexTarget = "line"
paths = [
  '''^tests/stack/(appliance/test-appliance-setup|lifecycle/lock-wiring|test-backup|test-cli-restore-hardening|test-wizard-setup)\.sh$''',
]
regexes = [
  '''PROXY_AUTH_TOKEN=(0123456789abcdef01234567|abcdef0123456789abcdef01)[ \t\r\n]*\z''',
]

[[allowlists]]
description = "Synthetic stale dashboard-hash restore fixtures"
condition = "AND"
regexTarget = "line"
paths = [
  '''^tests/stack/(appliance/test-appliance-setup|test-cli-restore-hardening)\.sh$''',
]
regexes = ['''DASHBOARD_AUTH_HASH_B64=c3RhbGUtZml4dHVyZQ==[ \t\r\n]*\z''']
