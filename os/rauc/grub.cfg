# A/B slot selection with boot counting — adapted from RAUC's contrib/grub.conf.
# RAUC writes ORDER/<slot>_OK/<slot>_TRY into this grubenv; GRUB picks the first slot that is
# marked OK and has not already been tried, so an update that never marks itself good falls back.
default=0
# 5 s, not 3: long enough for a person at the console to reach "Set up again" (#1318). An
# unattended boot still takes the default entry by itself.
timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_VERSION="unknown"
set B_VERSION="unknown"
set MEDIA=""
load_env

set MEDIA_LABEL=""
if [ "$MEDIA" == "usb" ]; then set MEDIA_LABEL="USB drive: "; fi
if [ "$MEDIA" == "internal" ]; then set MEDIA_LABEL="Internal disk: "; fi

# The first entry always boots the slot selected by RAUC state. Keep selection separate from
# default=0 so "slot A selected" and "nothing selectable" cannot collapse into the same value.
set SELECTED=0
set CURRENT_SLOT=A
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        CURRENT_SLOT=$SLOT
        SELECTED=1
        break
    fi
done

# Nothing selectable: clear the try flags so a slot marked good gets another chance next boot.
if [ "$SELECTED" -eq 0 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
        A_TRY=0
    fi
    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
        B_TRY=0
    fi
fi

save_env A_TRY A_OK B_TRY B_OK ORDER

# Human labels distinguish an absent legacy value from a slot explicitly recorded as empty.
set A_NAME="Pithead $A_VERSION"
set B_NAME="Pithead $B_VERSION"
if [ "$A_VERSION" == "unknown" ]; then set A_NAME="Pithead version unknown"; fi
if [ "$B_VERSION" == "unknown" ]; then set B_NAME="Pithead version unknown"; fi
if [ -z "$A_VERSION" ]; then set A_NAME="empty"; fi
if [ -z "$B_VERSION" ]; then set B_NAME="empty"; fi
set A_STATE="previous"
set B_STATE="previous"
if [ "$CURRENT_SLOT" == "A" ]; then set A_STATE="current"; fi
if [ "$CURRENT_SLOT" == "B" ]; then set B_STATE="current"; fi
set A_TITLE="${MEDIA_LABEL}$A_NAME (slot A, $A_STATE)"
set B_TITLE="${MEDIA_LABEL}$B_NAME (slot B, $B_STATE)"
if [ -z "$A_VERSION" ]; then set A_TITLE="${MEDIA_LABEL}empty (slot A)"; fi
if [ -z "$B_VERSION" ]; then set B_TITLE="${MEDIA_LABEL}empty (slot B)"; fi

# "Set up again" follows the selected slot and adds only its kernel flag.
set SETUP_PART=gpt2
set SETUP_SLOT=A
set CURRENT_NAME="$A_NAME"
if [ "$CURRENT_SLOT" == "B" ]; then
    set SETUP_PART=gpt3
    set SETUP_SLOT=B
    set CURRENT_NAME="$B_NAME"
fi

set CURRENT_TITLE="${MEDIA_LABEL}$CURRENT_NAME (slot $CURRENT_SLOT, current)"
set SETUP_TITLE="${MEDIA_LABEL}Set up again (setup wizard; keeps saved settings)"

# A one-boot entry choice written by the running system — `grub-editenv <grubenv> set
# next_entry=N`, the mechanism grub-reboot uses — consumed here so the boot after it takes the
# default again. The slot counting above does not see it: the entry it names still boots the slot
# the counting chose.
if [ -n "$next_entry" ]; then
    set default="$next_entry"
    set next_entry=
    save_env next_entry
fi

# Slots are addressed BY PARTITION, never by filesystem label. A RAUC bundle carries one
# filesystem image that installs into whichever slot is spare, so its fs label cannot encode the
# slot — after an install both slots would claim the same label and `search --label system-b`
# fails with "no such device". The GPT partition label survives (RAUC writes the partition, not
# the table), so the kernel still uses root=/dev/disk/by-partlabel/.
#
# The disk is derived from wherever GRUB found this config — i.e. our own ESP — rather than
# hardcoded to hd0. A mining box commonly has several drives, and (hd0,...) would happily boot a
# slot on the wrong one.
# $root is 'hd0,gpt1' — a bare device spec with NO surrounding parentheses. Matching a leading
# '(' leaves DISK empty and yields `set root=(,gpt2)`, which fails to boot at all.
regexp --set=1:DISK '^([^,]+)' "$root"

# No rw: the root stays READ-ONLY. That is the point of the appliance — the stack cannot be
# mutated at runtime, only replaced wholesale by an update. Writable state is explicit:
# /var is an overlay whose upper layer lives on the data partition (machine state: logs,
# container storage), and /data holds operator state. See the fstab written by mkimage.sh.
# The console is this appliance's ONLY interface before the setup page exists — it carries the
# one-time token, the generated dashboard password and the stratum address. Kernel chatter that
# scrolls those away is therefore a real defect, not cosmetic noise:
#
#   loglevel=4              warnings and above on the console. The JOURNAL still records
#                           everything (Storage=persistent), so nothing is lost for debugging —
#                           only the console is quieted. NB not lower: the harness reads
#                           userspace banners, but a real kernel error must still be visible to
#                           an operator standing at the machine.
#   drm_kms_helper.poll=0   stop display hotplug POLLING. A bad panel EDID (the HP bench laptop
#                           has one) is re-read every few seconds and logged every time, which is
#                           what actually buries the token. An appliance never needs to notice a
#                           monitor being plugged in.
CMDLINE="console=tty1 console=ttyS0 loglevel=4 drm_kms_helper.poll=0 panic=60"

# Titles name the version, physical slot and RAUC-selected state. The OK/TRY counters remain
# bootloader bookkeeping and stay out of operator text.
#
# The kernel root is the PARTUUID of the partition GRUB actually chose, probed at boot time —
# never a label. Labels are identical on every pithead disk BY DESIGN (the installer copies the
# running system), so the moment an installed disk and the install stick are present together,
# root=/dev/disk/by-partlabel/system-a means whichever udev processed last: the stick's GRUB
# could silently boot the internal disk's system, or the reverse. The PARTUUID is unique per
# partition and `probe` resolves it from $root, so the kernel always boots the slot GRUB picked.
menuentry "$CURRENT_TITLE" {
    set root=($DISK,$SETUP_PART)
    probe --set=PU --part-uuid ($DISK,$SETUP_PART)
    linux /vmlinuz root=PARTUUID=$PU $CMDLINE rauc.slot=$CURRENT_SLOT
    initrd /initrd.img
}

menuentry "$A_TITLE" {
    set root=($DISK,gpt2)
    probe --set=PU --part-uuid ($DISK,gpt2)
    linux /vmlinuz root=PARTUUID=$PU $CMDLINE rauc.slot=A
    initrd /initrd.img
}

menuentry "$B_TITLE" {
    set root=($DISK,gpt3)
    probe --set=PU --part-uuid ($DISK,gpt3)
    linux /vmlinuz root=PARTUUID=$PU $CMDLINE rauc.slot=B
    initrd /initrd.img
}

# #1318: the way back to the setup page from the machine itself. Same slot as the default boot,
# one extra flag; pithead-setup-again.service (the only reader of the flag) opens the wizard
# BESIDE the saved role, and nothing on /data changes unless a new role is accepted there.
menuentry "$SETUP_TITLE" {
    set root=($DISK,$SETUP_PART)
    probe --set=PU --part-uuid ($DISK,$SETUP_PART)
    linux /vmlinuz root=PARTUUID=$PU $CMDLINE rauc.slot=$SETUP_SLOT pithead.setup=1
    initrd /initrd.img
}
